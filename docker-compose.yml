  mongo:
    image: mongo:${VER_MONGO:-7.0}
    container_name: mongo_service
    ports:
      - "47017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin_pass
      - MONGO_INITDB_DATABASE=mydb
    volumes:
      - mongo_data:/data/db

    networks:
      - app_network

  redis:
    image: redis:${VER_REDIS:-7}
    container_name: redis_service
    ports:
      - "6379:6379"
    networks:
      - app_network


  nats:
    build: ./broker
    container_name: nats_service
    restart: always
    ports:
      - "4222:4222"
      - "6222:6222" # Puerto para clientes
      - "8222:8222" # Interfaz web de administración (opcional)
    volumes:
      - nats_data:/var/lib/nats

    networks:
      - app_network



  minio:
    image: minio/minio:${VER_MINIO:-latest}
    container_name: minio_service
    ports:
      - "9000:9000"
      - "9001:9001" # Puerto del dashboard
    environment:
      - MINIO_ACCESS_KEY=minio_access
      - MINIO_SECRET_KEY=minio_secret
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - app_network


  clickhouse:
    image: clickhouse/clickhouse-server:${VER_CLICKHOUSE:-latest}
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9004:9000"
    environment:
      - CLICKHOUSE_DB=events
      - CLICKHOUSE_USER=admin
      - CLICKHOUSE_PASSWORD=admin_pass
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - app_network
    volumes:
      - clickhouse_data:/var/lib/clickhouse

networks:
  app_network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  minio_data:
    driver: local
  nats_data:
    driver: local
  clickhouse_data:
    driver: local
